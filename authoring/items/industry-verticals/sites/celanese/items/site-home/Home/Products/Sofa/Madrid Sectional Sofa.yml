    - ID: "e35644f6-b680-4f40-9c7a-def95adfedda"
      Hint: LongDescription
      Value: <p>Madridセクショナルソファは、L字型デザインで広々とした座席を提供します。耐久性のあるポリエステル張り地で、家族の集まりや映画鑑賞に最適です。シェーズロングがさらに快適さを加えます。</p>
    - ID: "e5b1f5b3-a36d-4fd3-8df7-c9878ebfb6cf"
      Hint: pageSummary
      Value: 広々として招き入れるデザインのMadridセクショナルソファは、Forma Luxの「快適さと機能性の融合」という哲学を体現しています。L字型のシルエットと統合されたシェーズロングは、集まりの場に十分なスペースを提供し、耐久性のあるポリエステル張り地が長寿命と柔らかさを保証します。ブラック、インディゴ、ホワイトのカラーと、大型または特大型サイズでご利用いただけます。Madridは、活気ある家族のひとときや静かな夜のために設計されています。それはバランスの研究です：広々としたプロポーション、ミニマリストな形状、そして持続的な快適さ。
