    - ID: "6b43d550-6d5f-46ce-ac84-3d9493c45bc6"
      Hint: metadataDescription
      Value: |
        Forma Luxのルミナコレクションをご覧ください。モジュール式ソファ、アクセントチェア、手作りのテーブルで構成された厳選されたシリーズで、調和、光、そして長寿命をお住まいにお届けします。バランスと持続可能な美しさを追求して設計された各アイテムは、Forma Luxの洗練された生活哲学を反映しています。
        お部屋に合う家具をお探しなら、ルミナコレクションは温かみのある自然素材、モダンなシルエット、そしてどんなインテリアにも美しく適応するモジュール式の多用途性を提供します。
