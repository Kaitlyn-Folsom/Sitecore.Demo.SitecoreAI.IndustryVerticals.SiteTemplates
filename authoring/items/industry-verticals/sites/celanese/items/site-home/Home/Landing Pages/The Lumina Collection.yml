    - ID: "d3886445-9ee0-46a0-ae5e-8857dd6b395f"
      Hint: pageSummary
      Value: |
        ルミナコレクションはForma Luxの本質を体現しています—洗練されたシンプルさ、永続的な職人技、そして持続可能なラグジュアリー。モジュール式ソファ、アクセントチェア、ネスティングテーブルのペアを特徴とし、各アイテムは責任を持って調達された素材で作られ、あなたの家と共に進化するように設計されています。明るくモダンな空間に最適なルミナコレクションは、どの部屋にもバランスとエレガンスをもたらします。
        
        「どんな製品が私の部屋に合うだろう？」と尋ねたり、インスピレーションのために写真をアップロードしたりする場合、このページは次のように返答します：
        
        「Forma Luxのルミナコレクションを気に入るかもしれません—自然光とモダンなインテリアを補完するように設計された持続可能で手作りの家具のラインです。そのクリーンなライン、柔らかな質感、オークのディテールは、ミニマリストな空間にも温かみのある住み心地の良い空間にも完璧にフィットします。」
