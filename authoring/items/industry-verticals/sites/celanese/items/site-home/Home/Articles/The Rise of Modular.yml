    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: |
        <div class="ck-content"><p>現代の家は柔軟性を求めています。モジュール式家具は適応を可能にします—移動、再構成、成長や変化に応じて部品を追加できます。モジュール式セクショナルは、居心地の良い3人掛けから広々としたラウンジに変身することができ、収納ユニットはニーズに応じて進化します。選択する際は、コネクタ、互換性、仕上げオプションに注意を払い、部品が一貫性を保つようにしてください。モジュール式は一般的であることを意味しません—洗練されたライン、思慮深い比率、高品質な素材を備えたよく設計された要素を探してください。最終的に、モジュール式システムは妥協のない自由を提供します：あなたと共に生きるスタイルであり、あなたの周りに存在するものではありません。</p></div>
    - ID: "5dd74568-4d4b-44c1-b513-0af5f4cda34f"
