  - ID: "b5e02ad9-d56f-4c41-a065-a133db87bdeb"
    Hint: __Display name
    Value: 持続可能なスタイル：地球に優しいモダン家具
  Versions:
  - Version: 1
    Fields:
    - ID: "17b75967-9b67-4eb9-bb35-bbe0228ca368"
      Hint: pageSummary
      Value: 家具を選ぶ際に、見た目が良いだけでなく、環境にも良いものを選ぶ方法を発見してください。責任を持って調達された木材、低VOC仕上げ材、リサイクル素材、耐久性のある構造を探求し、スタイリッシュで持続可能な住まいを実現しましょう。
    - ID: "25bed78c-4957-4165-998a-ca1b52f67497"
      Hint: __Created
