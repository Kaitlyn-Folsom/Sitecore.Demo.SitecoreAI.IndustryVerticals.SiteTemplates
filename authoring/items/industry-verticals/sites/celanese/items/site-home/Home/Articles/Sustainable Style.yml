    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: |
        <div class="ck-content"><p>より多くの消費者が、見た目が良いだけでなく、環境にも良い家具を選ぶようになっています。責任を持って調達された木材、低VOC仕上げ材、リサイクル金属、持続可能性が認証された繊維で作られた家具を探してください。モダンデザインは理想的な組み合わせです：素材の誠実さとシンプルさへの強調が、持続可能に作られた家具に美しくフィットします。頑丈な構造—高品質な接合技術、耐久性のある素材—を選ぶことで、投資が長持ちします。「少なく買い、良いものを買う」ことで廃棄物を減らすことができます。その結果、あなたの価値観とスタイルを同時に反映する住まいが実現します。</p></div>
    - ID: "5dd74568-4d4b-44c1-b513-0af5f4cda34f"
      Hint: __Created by
      Value: |
        sitecore\movin.tilakaratne@sitecore.com
