    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: |
        <div class="ck-content"><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FranklinGothicFS-Book;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:1rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Navigating Medicare can be confusing—especially with so many myths floating around. Let’s clear up the most common misconceptions so you can make informed decisions for yourself or your spouse.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FrutigerLTStd-Roman;font-size:2rem;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.2;margin-bottom:0.5rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Myth: You’re eligible for Medicare as soon as you retire.</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FranklinGothicFS-Book;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:1rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Fact</strong>: <a style="background-color:transparent;box-shadow:none !important;box-sizing:border-box;color:rgb(3, 50, 101);font-family:FrutigerLTStd-Roman;font-weight:normal;touch-action:manipulation;" href="https://www.hhs.gov/answers/medicare-and-medicaid/who-is-eligible-for-medicare/index.html"><u>Medicare eligibility</u></a> typically begins at age 65, regardless of when you retire. Exceptions exist for individuals with qualifying disabilities, ALS, or end-stage renal disease, or those covered by the Railroad Retirement Board.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FrutigerLTStd-Roman;font-size:2rem;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.2;margin-bottom:0.5rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Myth: You can’t enroll in Medicare if you or your spouse are still working and have employer health coverage.</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FranklinGothicFS-Book;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:1rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Fact</strong>: If you’ve paid Medicare taxes for at least 10 years, you’ll be eligible for premium-free Part A (Hospital), even if you’re employed. Many people enroll in Part A at 65 because it’s free and can supplement employer coverage. Whether you sign up for Medicare Part B—or delay—largely depends on the size of your employer. Check out this blog post for more information: <a style="background-color:transparent;box-shadow:none !important;box-sizing:border-box;color:rgb(3, 50, 101);font-family:FrutigerLTStd-Roman;font-weight:normal;touch-action:manipulation;" href="https://www.bankerslife.com/insights/healthy-aging/when-to-sign-up-for-medicare-if-you-re-still-working-at-65/"><u>When to Sign Up for Medicare If You’re Still Working at 65</u></a>.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FrutigerLTStd-Roman;font-size:2rem;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.2;margin-bottom:0.5rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Myth: Spouses can share a Medicare plan.</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FranklinGothicFS-Book;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:1rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Fact</strong>: Medicare is individual coverage. However, a non-working spouse aged 65 may be able to qualify for Medicare based on the <a style="background-color:transparent;box-shadow:none !important;box-sizing:border-box;color:rgb(3, 50, 101);font-family:FrutigerLTStd-Roman;font-weight:normal;touch-action:manipulation;" href="https://www.medicalnewstoday.com/articles/does-medicare-cover-peoples-spouses"><u>working spouse’s history</u></a>.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FrutigerLTStd-Roman;font-size:2rem;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.2;margin-bottom:0.5rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Myth: Widowed or divorced spouses can’t qualify based on a former spouse’s work history.</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FranklinGothicFS-Book;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:1rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Fact</strong>: If you were married <a style="background-color:transparent;box-shadow:none !important;box-sizing:border-box;color:rgb(3, 50, 101);font-family:FrutigerLTStd-Roman;font-weight:normal;touch-action:manipulation;" href="https://www.medicalnewstoday.com/articles/does-medicare-cover-peoples-spouses#:~:text=Sometimes%2C%20even%20a,or%20disability%20criteria."><u>for at least 10 years</u></a> before divorce or nine months before your spouse’s death, you may be eligible for Medicare based on their work record.</p><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FrutigerLTStd-Roman;font-size:2rem;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.2;margin-bottom:0.5rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Key Eligibility Requirements Everyone Should Know</strong></h2><ul style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FranklinGothicFS-Book;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:1rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><li style="box-sizing:border-box;"><a style="background-color:transparent;box-shadow:none !important;box-sizing:border-box;color:rgb(3, 50, 101);font-family:FrutigerLTStd-Roman;font-weight:normal;touch-action:manipulation;" href="https://www.cms.gov/medicare/enrollment-renewal/original-part-a-b"><u>You must be</u></a> a U.S. citizen or a legal resident with a stable U.S. address for at least five years.</li><li style="box-sizing:border-box;">Once enrolled, <a style="background-color:transparent;box-shadow:none !important;box-sizing:border-box;color:rgb(3, 50, 101);font-family:FrutigerLTStd-Roman;font-weight:normal;touch-action:manipulation;" href="https://www.medicareinteractive.org/understanding-medicare/coordinating-medicare-with-other-insurance/job-based-insurance-and-medicare/health-savings-accounts-hsas-and-medicare"><u>you must stop</u></a> contributing to Health Savings Accounts (HSAs), though you can still use existing funds for qualified expenses.</li></ul><h2 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FrutigerLTStd-Roman;font-size:2rem;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.2;margin-bottom:0.5rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">Bonus Tip: Don’t Miss Your Enrollment Window</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FranklinGothicFS-Book;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:1rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Most people must enroll during their <a style="background-color:transparent;box-shadow:none !important;box-sizing:border-box;color:rgb(3, 50, 101);font-family:FrutigerLTStd-Roman;font-weight:normal;touch-action:manipulation;" href="https://www.medicare.gov/basics/get-started-with-medicare/sign-up/when-does-medicare-coverage-start"><u>Initial Enrollment Period (IEP)</u></a>—a seven-month window around your 65th birthday. Missing it could lead to lifetime penalties. If you’re still working, you may qualify for a Special Enrollment Period instead.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FranklinGothicFS-Book;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:1rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Want more? Check out our blog, <a style="background-color:transparent;box-shadow:none !important;box-sizing:border-box;color:rgb(3, 50, 101);font-family:FrutigerLTStd-Roman;font-weight:normal;touch-action:manipulation;" href="https://www.bankerslife.com/insights/understanding-insurance/understanding-the-difference-original-medicare-vs-medicare-advantage/"><u>Understanding the Difference: Original Medicare vs. Medicare Advantage</u></a></p><h3 style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FrutigerLTStd-Roman;font-size:1.75rem;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:500;letter-spacing:normal;line-height:1.2;margin-bottom:0.5rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:border-box;font-weight:bolder;">We’re Here for You!</strong></h3><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(33, 37, 41);font-family:FranklinGothicFS-Book;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;margin-bottom:1rem;margin-top:0px;orphans:2;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Bankers Life is here to help customers with their financial and insurance needs so please visit us at&nbsp;<a style="background-color:transparent;box-shadow:none !important;box-sizing:border-box;color:rgb(3, 50, 101);font-family:FrutigerLTStd-Roman;font-weight:normal;touch-action:manipulation;" href="http://bankerslife.com/"><u>BankersLife.com</u></a>&nbsp;to learn more.</p></div>
