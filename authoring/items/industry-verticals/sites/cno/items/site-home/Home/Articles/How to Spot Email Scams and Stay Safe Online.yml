    - ID: "56a52337-177b-46b4-ae72-6b9083bb6700"
      Hint: Content
      Value: |
        <div class="ck-content"><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">That “urgent” email may not be what it seems.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Email scams have become increasingly polished and convincing. Scammers now disguise their messages to look like they’re coming from trusted organizations, using fake addresses that mimic real ones—often with just a single character swapped. Their goal? To gain your trust long enough to trick you into clicking, sharing personal information, or downloading harmful software.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">One of the most common types of email fraud is <em style="box-sizing:inherit;"><i><em>phishing</em></i></em>, an apt name for a tactic where cybercriminals “fish” for victims willing to bite.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">While older adults are frequently targeted, <em style="box-sizing:inherit;"><i><em>anyone</em></i></em> can fall victim. There’s no shame in being deceived, but a little awareness goes a long way in staying safe.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Related: <a style="background-color:transparent;box-sizing:inherit;color:rgb(0, 87, 175);" href="https://www.bankerslife.com/insights/life-events/romance-scams-6-tips-to-prevent-financial-ruin/"><u>Romance Scams: 6 Tips to Prevent Financial Ruin</u></a></p><h2 class="wp-block-heading" style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;clear:both;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;line-height:1.4;margin-block:1rem 0px;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;" id="h-how-email-scams-work"><strong style="box-sizing:inherit;font-weight:bolder;">How Email Scams Work</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Scammers rely heavily on a tactic called spoofing—crafting fake email addresses that closely resemble real ones. Everything in the email may look legitimate, but the message and the link inside often lead to a fraudulent website.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">These spoofed sites may ask you to enter sensitive details, such as login credentials, account numbers, or personal information. Once entered, that data goes straight to the scammer, who may use it to drain accounts, impersonate you, or even commit identity theft. Sometimes, simply clicking the link can trigger a malware download that compromises your device.</p><h2 class="wp-block-heading" style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;clear:both;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;line-height:1.4;margin-block:1rem 0px;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;" id="h-what-scammers-want"><strong style="box-sizing:inherit;font-weight:bolder;">What Scammers Want</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Cybercriminals are usually after:</p><ul class="wp-block-list" style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;list-style:disc;margin-block:1rem 0px;margin-bottom:1.5em;margin-right:auto !important;margin-top:0px;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><li style="box-sizing:inherit;line-height:1.5;margin-bottom:1rem;padding-left:0.5rem;"><p style="margin-left:auto !important;"><strong style="box-sizing:inherit;font-weight:bolder;">Passwords and login information</strong></p></li><li style="box-sizing:inherit;line-height:1.5;margin-bottom:1rem;padding-left:0.5rem;"><p style="margin-left:auto !important;"><strong style="box-sizing:inherit;font-weight:bolder;">Bank and credit card numbers</strong></p></li><li style="box-sizing:inherit;line-height:1.5;margin-bottom:1rem;padding-left:0.5rem;"><p style="margin-left:auto !important;"><strong style="box-sizing:inherit;font-weight:bolder;">Social Security numbers or other identity details</strong></p></li><li style="box-sizing:inherit;line-height:1.5;margin-bottom:1rem;padding-left:0.5rem;"><p style="margin-left:auto !important;"><strong style="box-sizing:inherit;font-weight:bolder;">Remote access to your device via malware</strong></p></li></ul><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Armed with this information, they can access accounts, open new ones, or impersonate you for financial gain.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">You might be interested in, <a style="background-color:transparent;box-sizing:inherit;color:rgb(0, 87, 175);" href="https://www.bankerslife.com/insights/personal-finance/how-to-recognize-tax-scams-during-filing-season/"><u>How to Recognize Tax Scam During Filing Season</u></a></p><h2 class="wp-block-heading" style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;clear:both;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;line-height:1.4;margin-block:1rem 0px;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;" id="h-common-warning-signs-of-email-scams"><strong style="box-sizing:inherit;font-weight:bolder;">Common Warning Signs of Email Scams</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">According to the Federal Trade Commission (FTC), phishing emails often include attention‑grabbing statements or requests meant to provoke a quick reaction. For example, the email may claim:</p><ul class="wp-block-list" style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;list-style:disc;margin-block:1rem 0px;margin-bottom:1.5em;margin-right:auto !important;margin-top:0px;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><li style="box-sizing:inherit;line-height:1.5;margin-bottom:1rem;padding-left:0.5rem;"><p style="margin-left:auto !important;">There were unusual login attempts on your account.</p></li><li style="box-sizing:inherit;line-height:1.5;margin-bottom:1rem;padding-left:0.5rem;"><p style="margin-left:auto !important;">Your payment information is outdated or incorrect.</p></li><li style="box-sizing:inherit;line-height:1.5;margin-bottom:1rem;padding-left:0.5rem;"><p style="margin-left:auto !important;">You must confirm personal details to avoid losing access.</p></li><li style="box-sizing:inherit;line-height:1.5;margin-bottom:1rem;padding-left:0.5rem;"><p style="margin-left:auto !important;">You should click a link to pay a bill, claim a prize, or receive a refund.</p></li><li style="box-sizing:inherit;line-height:1.5;margin-bottom:1rem;padding-left:0.5rem;"><p style="margin-left:auto !important;">Something requires immediate action.</p></li></ul><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Scammers count on urgency; the less time you spend thinking, the more likely you are to click.</p><h2 class="wp-block-heading" style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;clear:both;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;line-height:1.4;margin-block:1rem 0px;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;" id="h-how-to-protect-yourself-from-phishing-attempts"><strong style="box-sizing:inherit;font-weight:bolder;">How to Protect Yourself From Phishing Attempts</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">You can dramatically reduce your risk by <a style="background-color:transparent;box-sizing:inherit;color:rgb(0, 87, 175);" href="https://consumer.ftc.gov/articles/how-recognize-avoid-phishing-scams"><u>taking a few simple steps</u></a>:</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:inherit;font-weight:bolder;">1. Don’t click links in suspicious emails</strong></p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">If something feels off, don’t interact with links or attachments. Instead, visit the official website by typing the address into your browser, or contact the organization using a verified phone number.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:inherit;font-weight:bolder;">2. Use multifactor authentication (MFA)</strong></p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">MFA adds an extra layer of verification, such as a passcode, fingerprint, or security question. Even if a scammer gets your password, MFA can stop them from accessing your account.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:inherit;font-weight:bolder;">3. Stay alert for subtle signs</strong></p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">A single misspelling in the email address, an unexpected tone, or odd formatting may indicate fraud.</p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><strong style="box-sizing:inherit;font-weight:bolder;">4. Keep your software and devices updated</strong></p><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Security updates help protect you from the latest threats.</p><h2 class="wp-block-heading" style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;clear:both;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;line-height:1.4;margin-block:1rem 0px;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;" id="h-what-to-do-if-you-think-you-ve-been-scammed"><strong style="box-sizing:inherit;font-weight:bolder;">What to Do if You Think You’ve Been Scammed</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">If you suspect you’ve clicked a phishing link or shared sensitive information, act quickly:</p><ul class="wp-block-list" style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:border-box;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;list-style:disc;margin-block:1rem 0px;margin-bottom:1.5em;margin-right:auto !important;margin-top:0px;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;"><li style="box-sizing:inherit;line-height:1.5;margin-bottom:1rem;padding-left:0.5rem;"><p style="margin-left:auto !important;"><strong style="box-sizing:inherit;font-weight:bolder;">Report the scam</strong> at <a style="background-color:transparent;box-sizing:inherit;color:rgb(0, 87, 175);" href="https://reportfraud.ftc.gov/"><em style="box-sizing:inherit;"><i><u><em>reportfraud.ftc.gov</em></u></i></em></a></p></li><li style="box-sizing:inherit;line-height:1.5;margin-bottom:1rem;padding-left:0.5rem;"><p style="margin-left:auto !important;"><strong style="box-sizing:inherit;font-weight:bolder;">Report identity theft</strong> at <a style="background-color:transparent;box-sizing:inherit;color:rgb(0, 87, 175);" href="https://www.identitytheft.gov/"><em style="box-sizing:inherit;"><i><u><em>identitytheft.gov</em></u></i></em></a></p></li></ul><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Both sites offer step‑by‑step guidance based on what happened. Taking action early can limit the damage and help protect your accounts.</p><h2 class="wp-block-heading" style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;clear:both;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:26px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;letter-spacing:normal;line-height:1.4;margin-block:1rem 0px;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;" id="h-stay-informed-and-stay-safe"><strong style="box-sizing:inherit;font-weight:bolder;">Stay Informed and Stay Safe</strong></h2><p style="-webkit-text-stroke-width:0px;background-color:rgb(255, 255, 255);box-sizing:inherit;color:rgb(51, 51, 51);font-family:OpenSans, sans-serif;font-size:16px;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:1.5;margin-block:1rem 0px;margin-bottom:1.5em;margin-left:auto !important;margin-right:auto !important;max-width:750px;orphans:2;text-align:start;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;white-space:normal;widows:2;word-spacing:0px;">Knowing the red flags—and how to react—gives you the best chance of protecting both your identity and your finances. With scammers continually refining their tactics, awareness is one of your strongest defenses.</p></div>
