      Hint: pageSummary
      Value: "TrailNova XT mixes trail-inspired durability with everyday sneaker comfort. With grip-focused traction, supportive cushioning, and a rugged profile, it gives Famous Footwear shoppers a dependable style for active weekends, changing weather, and on-the-go routines."
