      Hint: pageSummary
      Value: "MetroCourt Classic channels iconic court styling into an easy, wear-with-everything sneaker. With a low-profile silhouette, cushioned feel, and clean finish, it offers Famous Footwear shoppers a dependable casual sneaker with just the right retro edge."
