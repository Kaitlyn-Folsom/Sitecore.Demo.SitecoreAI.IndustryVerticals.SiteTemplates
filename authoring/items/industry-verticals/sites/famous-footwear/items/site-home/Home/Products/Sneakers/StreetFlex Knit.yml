      Hint: LongDescription
      Value: "<p>StreetFlex Knit combines a modern slip-on-inspired knit upper with lightweight cushioning and a flexible sole for effortless all-day wear. It is designed for shoppers who want a clean, modern sneaker that looks polished enough for city days while staying comfortable on the move.</p>"
    - ID: "e5b1f5b3-a36d-4fd3-8df7-c9878ebfb6cf"
      Hint: pageSummary
      Value: "StreetFlex Knit pairs streamlined style with the soft, flexible comfort of a modern knit upper. Lightweight, easy to wear, and built for day-to-night movement, it gives Famous Footwear shoppers a contemporary sneaker option that feels as good as it looks."
